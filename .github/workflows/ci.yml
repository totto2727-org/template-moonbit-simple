name: CI

# Keep this trigger when creating a project from the template.
# Change it only for an explicit user request or a demonstrated project requirement.
# Do not replace main-push publication with tag or release triggers.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@4d9519caedd113884fbb2f2c8d84f2728984ec8c
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@4d9519caedd113884fbb2f2c8d84f2728984ec8c
